[project]
name = "pynecore-simbroker"
version = "0.1.0"
description = "PyneCore broker plugin with a simulated netting venue: candles from any installed live provider, orders filled in-process with persistent state; exercises the whole --broker path (journal, restart adoption, quarantine) without an exchange account"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pynesys-pynecore[cli]>=6.12,<7"]

[project.entry-points."pyne.plugin"]
simbroker = "pynecore_simbroker:SimBroker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pynecore_simbroker"]
