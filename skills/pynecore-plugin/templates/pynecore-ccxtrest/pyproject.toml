[project]
name = "pynecore-ccxtrest"
version = "0.1.0"
description = "PyneCore live data provider for CCXT exchanges over REST polling only (no websocket): same history and symbol info as the built-in ccxt plugin, live bars from fetch_ohlcv"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pynesys-pynecore[cli,ccxt]>=6.12"]

[project.entry-points."pyne.plugin"]
ccxtrest = "pynecore_ccxtrest:CCXTRestProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pynecore_ccxtrest"]
